apiVersion: apps/v1
kind: Deployment
metadata:
  name: metamorphosis
  labels:
    app: metamorphosis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metamorphosis
  template:
    metadata:
      labels:
        app: metamorphosis
    spec:
      containers:
      - name: metamorphosis
        image: metamorphosis/metamorphosis:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: PROMETHEUS_URL
          value: "http://prometheus:9090"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: metamorphosis-db-secret
              key: database-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: metamorphosis
spec:
  selector:
    app: metamorphosis
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP

